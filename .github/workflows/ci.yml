name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      # actions/checkout v4.4.0
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      # actions/setup-node v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      # npm 10 rejects this lockfile (`ajv@6.15.0` does not satisfy `ajv@8.20.0`).
      # npm 11.21.1 installs it. setup-node's Node 22 image still ships npm 10.
      - name: Install npm 11.21.1
        run: npm install -g npm@11.21.1
      - name: Print toolchain versions
        run: node -v && npm -v
      - run: npm ci
      - name: Install Chromium for calendar hit tests
        run: npx playwright install chromium
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - name: Tests pinned to 1 Nov 2026
        run: JF_PIN_CLOCK=2026-11-01T20:00:00.000Z npm test
      - name: Tests pinned to 1 Dec 2026
        run: JF_PIN_CLOCK=2026-12-01T20:00:00.000Z npm test
      - name: Tests pinned to 17 Nov 2026
        run: JF_PIN_CLOCK=2026-11-17T20:00:00.000Z npm test
      - name: Tests pinned to 29 Nov 2026
        run: JF_PIN_CLOCK=2026-11-29T20:00:00.000Z npm test
      - run: npm run test:shipped
      - run: npm run build
